<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validacion</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
</head>
<body>
    <div class="contenedor_principal ancho margen">
        <div class="contenedor_texto">
            <h2 class="azul">Contactanos</h2>
            <h1>¿Necesitas ayuda para hacer crecer tu negocio?</h1>
            <p>Solicita más información y juntos idearemos la estrategia perfecta para cumplir tus metas</p>
        </div>
        <div class="contenedor_formulario">
            <form action="form.php" method="get" id="formulario_comentarios">
                <input class="dos" type="text" name="nombre" id="nombre" placeholder="Nombre*">
                <input class="dos" type="text" name="apellidos" id="apellidos" placeholder="Apellidos*">
                <input class="dos" type="email" name="email" id="email" placeholder="Correo electronico*">
                <input class="dos" type="tel" name="tel" id="tel" placeholder="Numero de telefono movil*">
                <select class="block" name="presupuesto" id="pres">
                    <option value="">Selecciona tu presupuesto</option>
                    <option value="primero">De $18,000 - $25,000</option>
                    <option value="segundo">De $25,000 - $45,000</option>
                    <option value="tercero">De $45,000 - $100,000</option>
                </select>
                <input class="block" type="text" name="empresa" id="empresa" placeholder="Nombre de la empresa">
                <select id="selecciona_emp" class="block" name="industria" id="industria">
                    <option value="">Selecciona una industria de tu empresa*</option>
                    <option value="inmobiliaria">Inmobiliaria</option>
                    <option value="educacion">Educación</option>
                    <option value="turismo">Turismo</option>
                    <option value="energias">Energías renovables</option>
                    <option value="servprof">Servicios profesionales</option>
                    <option value="startup">Startup</option>
                    <option value="ecommerce">Ecommerce</option>
                    <option value="financiera">Financiera</option>
                    <option value="salud">Salud</option>
                    <option value="agenciadig">Agencia digital</option>
                    <option value="otro">Otro</option>
                </select>
                <input class="block" type="text" name="sitioweb" id="sitioweb" placeholder="Sitio Web">
                <button id="btn_validar" type="button">Enviar</button>
            </form>
        </div>
    </div>

    <script>
        let expresionCorreo = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        $("#btn_validar").click(function(){
            //validar nombre
            if($("#nombre").val().trim() == ''){
                alert("Escribe tu nombre");
                $("#nombre").focus()
                return 0;
            }
            //validar apellidos
            if($("#apellidos").val().trim() == ''){
                alert("Ingresa tus apellidos");
                $("#apellidos").focus()
                return 0;
            }

             //validar correo
            if(!expresionCorreo.test($("#email").val().trim())){
                alert("Escribe un correo valido"); 
                $("#email").focus();
                return false; 
            }

            //validar tel
            if($("#tel").val().trim() == ''){
                alert("Ingresa tu numero de telefono");
                $("#tel").focus()
                return 0;
            }

            //validar industria
            if($("#selecciona_emp").val().trim() == ''){
                alert("selecciona una industria");
                $("#selecciona_emp").focus()
                return 0;
            }

            $("#formulario_comentarios").submit();
        });
    </script>
</body>
</html>
